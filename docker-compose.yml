services:
  ml:
    build:
      context: ./ml
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 12

  fe:
    build:
      context: ./fe
      args:
        API_BASE_URL: http://localhost:8010
    ports:
      - "8080:80"
    depends_on:
      ml:
        condition: service_healthy
